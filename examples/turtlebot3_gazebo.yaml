turtlebot3_gazebo:
  description: TurtleBot3 World in Gazebo (verified on Jazzy)
  meta:
    robot: turtlebot3_burger
    project_type: mobile
    simulator: gazebo
    rmw: rmw_zenoh_cpp
    mode: robust
    workspace: ${WS}            # clone of ROBOTIS-GIT/turtlebot3_simulations (branch jazzy)
    motion: {topic: /cmd_vel, type: TwistStamped, verified: true}
  env:
    RMW_IMPLEMENTATION: rmw_zenoh_cpp
    TURTLEBOT3_MODEL: burger
  runbook:
  - id: router
    title: Zenoh router
    reuse: true
    run: {cmd: ros2 run rmw_zenoh_cpp rmw_zenohd, bg: true}
    ready: [{port: 7447}]
    timeout: 20
  - id: launch
    title: ros2 launch turtlebot3_gazebo
    run:
      cmd: bash ${ROSHUB_HOME}/tools/ensure_built.sh ${WS} && source ${WS}/install/setup.bash && ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py
      bg: true
    ready: [{hz: /clock, min_hz: 1}]
    timeout: 1800
